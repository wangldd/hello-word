<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>电力通讯管理机规约转换配置</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="shell">
    <header class="hero">
      <div>
        <p class="eyebrow">Power Protocol Gateway</p>
        <h1>电力通讯管理机规约转换配置</h1>
        <p>通过前后端分离 Web 页面配置 IEC101/102/103/104、Modbus、IEC61850 等规约通道与点表映射。</p>
      </div>
      <button id="refreshBtn">刷新配置</button>
    </header>

    <section class="grid">
      <form id="channelForm" class="card">
        <h2>新增/更新通道</h2>
        <label>通道 ID<input name="channel_id" value="rtu-iec104-1" required /></label>
        <label>名称<input name="name" value="站控层 IEC104" required /></label>
        <label>规约<select name="protocol" class="protocol-select"></select></label>
        <label>启用<select name="enabled"><option value="true">启用</option><option value="false">停用</option></select></label>
        <label>端点 JSON<textarea name="endpoint" rows="5">{"host":"192.168.1.10","port":2404}</textarea></label>
        <label>高级参数 JSON<textarea name="options" rows="4">{"commonAddress":1,"timeoutMs":3000}</textarea></label>
        <button type="submit">保存通道</button>
      </form>

      <form id="mappingForm" class="card">
        <h2>新增/更新点表映射</h2>
        <label>映射 ID<input name="mapping_id" value="map-modbus-to-61850-1" required /></label>
        <label>源规约<select name="source_protocol" class="protocol-select"></select></label>
        <label>源地址<input name="source_address" value="holding_register:40001" required /></label>
        <label>目标规约<select name="target_protocol" class="protocol-select"></select></label>
        <label>目标地址<input name="target_address" value="IED1/MMXU1/PhV.phsA/cVal.mag.f" required /></label>
        <label>数据类型<input name="value_type" value="float" /></label>
        <div class="two-cols">
          <label>倍率<input name="scale" type="number" step="0.001" value="0.1" /></label>
          <label>偏移<input name="offset" type="number" step="0.001" value="0" /></label>
        </div>
        <label>描述<input name="description" value="A 相电压" /></label>
        <button type="submit">保存映射</button>
      </form>
    </section>

    <section class="grid">
      <form id="convertForm" class="card wide">
        <h2>转换联调</h2>
        <div class="two-cols">
          <label>源规约<select name="source_protocol" class="protocol-select"></select></label>
          <label>目标规约<select name="target_protocol" class="protocol-select"></select></label>
        </div>
        <label>源报文业务 JSON<textarea name="payload" rows="7">{"function":"holding_register","address":40001,"value":2205,"type":"float","unitId":1}</textarea></label>
        <button type="submit">执行转换</button>
      </form>

      <div class="card wide">
        <h2>当前配置 / 转换结果</h2>
        <pre id="output">等待加载...</pre>
      </div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
